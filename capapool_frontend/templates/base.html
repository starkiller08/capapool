{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CapaPool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Shared navigation bar used across the website -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="{% static 'images/briefcase-2.png' %}" class="logo-img" alt="CapaPool logo">
                <span>Capa<span>Pool</span></span>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="/jobs/">Find Jobs</a>
                <a href="/accounts/register/employer/">For Employers</a>
                <a href="/accounts/login/">Sign In</a>
                <a href="/accounts/register/candidate/" class="post-job-btn">Join Now</a>
            </div>

            <button class="menu-btn" id="menuBtn">☰</button>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Shared footer -->
    <footer class="footer">
        <p class="footer-logo">
            <img src="{% static 'images/briefcase-2.png' %}" class="footer-logo-img" alt="CapaPool logo">
            <span>Capa<span>Pool</span></span>
        </p>
        <p>&copy; 2026 CapaPool Inc. All rights reserved.</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
