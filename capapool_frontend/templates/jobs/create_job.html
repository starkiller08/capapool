{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="figma-form-page">
    <div class="figma-form-card">
        <div class="form-icon-box dark-icon-box">
            <img src="{% static 'images/briefcase-2.png' %}" alt="job icon">
        </div>

        <h1>Create Job Posting</h1>
        <p class="form-subtitle">Add a new role and start finding suitable candidates.</p>

        <form method="post" class="simple-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="figma-submit-btn">Create Job →</button>
        </form>

        <div class="form-bottom-text">
            <a href="{% url 'job_list' %}">Back to job list</a>
        </div>
    </div>
</section>

{% endblock %}
